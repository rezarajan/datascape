apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: internal-api
  namespace: flux-system
  labels:
    d7s.dev/managed-by: d7s
    d7s.dev/stack: internal-api
spec:
  interval: 10m
  path: ./out/apps/internal-api
  prune: true
  sourceRef:
    kind: GitRepository
    name: d7s
    namespace: flux-system
  dependsOn:
    - name: cnpg-operator
      namespace: flux-system
