name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    name: fast tier
    runs-on: ubuntu-latest
    # A slow fast-test is a defect (golden rule 43) — this budget is the guard.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/check.sh
