name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  fast:
    name: fast tier
    runs-on: ubuntu-latest
    # A slow fast-test is a defect (golden rule 43) — this budget is the guard.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/check.sh

  quickstart:
    name: quickstart (flake d7s + compile)
    runs-on: ubuntu-latest
    # Exercises QUICKSTART.md's own commands (rule 41 — docs example = e2e
    # test): the flake-built `d7s` compiles a stack the same way the docs
    # walk a developer through, so a stale vendorHash or a devShell
    # regression is caught here, not at cold-quickstart time.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix build .#d7s
      - name: nix develop drops a built d7s on PATH; compile the quickstart stack
        run: |
          cat > /tmp/quickstart-stack.yaml <<'EOF'
          apiVersion: d7s.dev/v1alpha1
          kind: Stack
          name: quickstart
          components:
            - kind: postgres
              name: orders-db
              placement: self-hosted
              credentials:
                secretRef:
                  name: orders-db-app
              guarantees:
                mtls: {}
              allowedConsumers:
                - serviceAccount: probe-client
          EOF
          nix develop --command d7s compile /tmp/quickstart-stack.yaml -o /tmp/quickstart-out
          test -f /tmp/quickstart-out/apps/quickstart/orders-db-cluster.yaml

  acceptance:
    name: acceptance (kind)
    runs-on: ubuntu-latest
    # Deep tier (golden rule 43): explicit, impact-selected, not what a
    # developer waits on locally. Native Docker on ubuntu-latest — no
    # nested virtualization, same substrate kind/CNPG/Flux test on.
    # Every action the harness runs (docs/plans/02-week-two.md Revision 3,
    # slice 6) is a flake package, so CI and local runs exercise the exact
    # same pinned, shellcheck-verified binaries; only the Docker daemon is
    # the runner's own.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix run .#acceptance

  acceptance-managed:
    name: acceptance (managed / neon)
    runs-on: ubuntu-latest
    # A real external service (Neon), not a cluster this runner conjures
    # from nothing — you cannot expect it to always be available for CI
    # (owner directive, week-two plan Revision 3). Runs only where a
    # cluster AND the NEON_API_KEY secret are both real: push to main or
    # manual dispatch, never a pull_request (fork PRs never receive
    # secrets at all — GitHub withholds them; this condition also skips
    # same-repo PRs, keeping the tier to the two triggers the plan names).
    # Secrets aren't readable in `if:` directly, so the standard pattern
    # is to map the secret into env and gate on emptiness inside the step
    # — a SKIPPED report, never a silent pass (rule 49).
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: run managed acceptance, or report SKIPPED when the secret is absent
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
        run: |
          if [ -z "$NEON_API_KEY" ]; then
            echo "SKIPPED (unknown): NEON_API_KEY repository secret not set — managed seam NOT verified this run" >&2
            echo "remedy: set the NEON_API_KEY repository secret to run this tier" >&2
            exit 0
          fi
          nix run .#acceptance-managed
