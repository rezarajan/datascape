name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  fast:
    name: fast tier
    runs-on: ubuntu-latest
    # A slow fast-test is a defect (golden rule 43) — this budget is the guard.
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: ./scripts/check.sh

  acceptance:
    name: acceptance (kind)
    runs-on: ubuntu-latest
    # Deep tier (golden rule 43): explicit, impact-selected, not what a
    # developer waits on locally. Native Docker on ubuntu-latest — no
    # nested virtualization, same substrate kind/CNPG/Flux test on.
    # Toolchain comes from flake.nix so CI and local runs exercise the
    # same pinned binaries; only the Docker daemon is the runner's own.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@v16
      - run: nix develop --command ./scripts/acceptance-kind.sh
