apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tf-runner-controlplane-egress
  namespace: week-one
  labels:
    d7s.dev/managed-by: d7s
    d7s.dev/stack: week-one
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: tf-runner
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
