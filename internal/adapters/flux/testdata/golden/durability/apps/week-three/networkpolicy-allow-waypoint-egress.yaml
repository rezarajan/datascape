apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-waypoint-egress
  namespace: week-three
  labels:
    d7s.dev/managed-by: d7s
    d7s.dev/stack: week-three
spec:
  podSelector:
    matchLabels:
      istio.io/gateway-name: waypoint
  policyTypes:
    - Egress
  egress:
    - {}
