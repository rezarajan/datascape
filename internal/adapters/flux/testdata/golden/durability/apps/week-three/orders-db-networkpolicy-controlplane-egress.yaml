apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: orders-db-controlplane-egress
  namespace: week-three
  labels:
    d7s.dev/component: orders-db
    d7s.dev/managed-by: d7s
    d7s.dev/stack: week-three
spec:
  podSelector:
    matchLabels:
      cnpg.io/cluster: orders-db
  policyTypes:
    - Egress
  egress:
    - ports:
        - protocol: TCP
          port: 6443
        - protocol: TCP
          port: 443
