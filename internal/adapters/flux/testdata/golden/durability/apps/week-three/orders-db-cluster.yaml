apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: orders-db
  namespace: week-three
  labels:
    d7s.dev/component: orders-db
    d7s.dev/managed-by: d7s
    d7s.dev/stack: week-three
  annotations:
    d7s.dev/guarantee-durability: conditional-on-external
spec:
  instances: 1
  bootstrap:
    initdb:
      database: orders-db
      owner: orders-db
      secret:
        name: orders-db-app
  storage:
    size: 1Gi
  backup:
    retentionPolicy: 30d
    barmanObjectStore:
      destinationPath: s3://d7s-backups/
      endpointURL: https://minio.d7s-harness.svc:9000
      s3Credentials:
        accessKeyId:
          name: backups-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: backups-credentials
          key: ACCESS_SECRET_KEY
