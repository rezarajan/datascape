    d7s.dev/stack: week-one
    istio.io/use-waypoint: waypoint
spec:
  hosts:
    - console.neon.tech
  location: MESH_EXTERNAL
  ports:
    - number: 443
      name: https
      protocol: TLS
  resolution: DNS
