apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: neon-control-plane-egress
  namespace: week-one
  labels:
    d7s.dev/managed-by: d7s
    d7s.dev/stack: week-one
spec:
  targetRefs:
    - group: networking.istio.io
      kind: ServiceEntry
      name: neon-control-plane
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/week-one/sa/tf-runner
