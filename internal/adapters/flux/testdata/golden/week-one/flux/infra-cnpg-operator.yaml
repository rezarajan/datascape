apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cnpg-operator
  namespace: flux-system
  labels:
    d7s.dev/managed-by: d7s
spec:
  interval: 10m
  path: ./out/infra/cnpg-operator
  prune: true
  sourceRef:
    kind: GitRepository
    name: d7s
    namespace: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: cnpg-operator
      namespace: cnpg-system
