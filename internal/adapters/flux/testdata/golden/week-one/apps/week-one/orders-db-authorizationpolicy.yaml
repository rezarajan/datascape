apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: orders-db
  namespace: week-one
  labels:
    d7s.dev/component: orders-db
    d7s.dev/managed-by: d7s
    d7s.dev/stack: week-one
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: orders-db
  rules:
    - from:
        - source:
            principals:
              - cluster.local/ns/week-one/sa/probe-client
      to:
        - operation:
            ports:
              - "5432"
    - from:
        - source:
            namespaces:
              - cnpg-system
      to:
        - operation:
            ports:
              - "8000"
