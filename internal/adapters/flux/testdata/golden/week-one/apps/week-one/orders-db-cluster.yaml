apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: orders-db
  namespace: week-one
  labels:
    d7s.dev/component: orders-db
    d7s.dev/managed-by: d7s
    d7s.dev/stack: week-one
spec:
  instances: 1
  bootstrap:
    initdb:
      database: orders-db
      owner: orders-db
      secret:
        name: orders-db-app
  storage:
    size: 1Gi
